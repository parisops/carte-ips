<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- AJOUT viewport-fit=cover : nécessaire pour que env(safe-area-inset-*)
         (utilisé dans EcranOnboarding.jsx) renvoie de vraies valeurs sur les
         mobiles à encoche/Dynamic Island plutôt que 0 par défaut — sans ce
         paramètre, le contenu pouvait apparaître coupé en haut d'écran. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trajectoires — IPS, IVAC, IVAL des établissements d'Île-de-France</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/react-leaflet-cluster@2.1.0/dist/assets/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/react-leaflet-cluster@2.1.0/dist/assets/MarkerCluster.Default.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- GoatCounter : mesure d'audience respectueuse du RGPD (pas de cookie,
         IP non stockée) — pas de bandeau de consentement nécessaire. -->
    <script data-goatcounter="https://parisops.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
